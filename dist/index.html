<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Colour Check</title>
<meta name="description" content="Check how well a shirt colour suits you. Runs entirely in your browser; photos never leave your device.">
<meta name="theme-color" content="#EFEFEF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colour Check">
<style>
/* Colour Check — styles. Mobile first; desktop split view from 900px wide (landscape). */
:root {
  --bg: #EFEFEF;
  --card: #FFFFFF;
  --ink: #161616;
  --ink-2: #333333;
  --muted: #555555;
  --line: #D4D4D4;
  --track: #E4E4E4;
  --good: #1E7A4C; --good-bg: #E6EFE9; --good-ink: #155C39;
  --warn: #B86B12; --warn-bg: #FFF1DC; --warn-ink: #7A4508; --tip-bg: #FFF6EA; --tip-ink: #5A3507;
  --bad: #B3261E;  --bad-bg: #FCE8E6;  --bad-ink: #8C1D18;
  --grey: #8A8A8A;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 20px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.noscript { padding: 24px; }
[hidden] { display: none !important; }

/* ---------- shared controls ---------- */
.btn-primary, .btn-outline, .btn-text {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; cursor: pointer; text-decoration: none; font-weight: 600; white-space: nowrap;
}
.btn-primary { height: 54px; padding: 0 26px; border-radius: 27px; background: var(--ink); color: #fff; font-size: 16px; }
.btn-primary:hover { background: #000; }
.btn-primary:disabled { background: #BDBDBD; color: #F4F4F4; cursor: not-allowed; }
.btn-outline { height: 52px; padding: 0 24px; border-radius: 26px; background: var(--card); border: 1.5px solid var(--ink); font-size: 15px; }
.btn-text { height: 40px; background: transparent; font-weight: 500; font-size: 14px; color: #444; }
.btn-text:hover { color: var(--ink); text-decoration: underline; }
.block { width: 100%; }
.icon-btn {
  width: 44px; height: 44px; flex: none; border-radius: 22px; border: 0; background: var(--card);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
}
.icon-btn.glass { background: rgba(255,255,255,.92); }
:focus-visible { outline: 3px solid #2B6CB0; outline-offset: 2px; }
.mono { font-family: var(--mono); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 13px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
.pill.good { background: var(--good-bg); color: var(--good-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.bad { background: var(--bad-bg); color: var(--bad-ink); }
.pill.ink { background: var(--ink); color: #fff; }
.pill.glass { background: rgba(255,255,255,.92); color: var(--ink); }
.pill.glass.warn { color: var(--warn-ink); }

.seg { display: inline-flex; background: #E2E2E2; border-radius: 16px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 13px; font-size: 13px; font-weight: 600; color: #444; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* ---------- top bar (desktop) ---------- */
.topbar { display: none; height: 64px; flex: none; padding: 0 40px; align-items: center; justify-content: space-between; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.privacy { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

/* ---------- start (mobile) ---------- */
.m-start { flex: 1; display: flex; flex-direction: column; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
.m-start .brand { height: 44px; display: flex; align-items: center; }
.m-start-actions { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.big-primary, .big-secondary { width: 100%; border-radius: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.big-primary { min-height: 260px; height: 38vh; max-height: 320px; background: var(--ink); color: #fff; border: 0; flex-direction: column; gap: 14px; padding: 20px; }
.big-primary .t { font-size: 22px; font-weight: 600; }
.big-primary .s { font-size: 14px; color: #CFCFCF; text-align: center; line-height: 1.4; max-width: 260px; }
.big-secondary { height: 112px; background: var(--card); border: 1.5px solid var(--ink); gap: 14px; font-size: 18px; font-weight: 600; }
.m-foot { margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); }

/* ---------- start (desktop) ---------- */
.d-start { flex: 1; display: flex; padding: 0 40px 40px; }
.dropzone {
  flex: 1; border: 2px dashed #A8A8A8; border-radius: 24px; background: #F7F7F6;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
  transition: background .15s, border-color .15s;
}
.dropzone.over { background: #FFFFFF; border-color: var(--ink); }
.dropzone h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.dropzone .or { font-size: 14px; color: var(--muted); margin: 0; }
.dropzone .hint { font-size: 13px; color: var(--muted); margin: 0; max-width: 520px; line-height: 1.5; }

/* ---------- work screen (calibrate / pick / result) ---------- */
.work { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); gap: 12px; }
.m-head { height: 44px; flex: none; display: flex; align-items: center; gap: 12px; }
.m-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.m-title .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.m-title .t { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-title.center { align-items: center; text-align: center; }
.m-title.center .t { font-size: 14px; font-weight: 500; color: #444; }
.head-spacer { width: 44px; flex: none; }
.status-line > .st:first-child:not(.good):not(.warn) { color: var(--muted); font-weight: 600; }

.stage-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.stage-box { width: 80%; height: 100%; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,.14); background: #DADADA; touch-action: none; }
.stage canvas.photo { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.marker { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; pointer-events: none; }
.marker.fabric { border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--ink), 0 2px 8px rgba(0,0,0,.3); }
.marker.white { border: 3px dashed #fff; box-shadow: 0 0 0 1.5px var(--ink); }
.loupe { position: fixed; z-index: 30; width: 132px; height: 132px; border-radius: 50%; overflow: hidden; pointer-events: none;
  border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--ink), 0 8px 24px rgba(0,0,0,.35); background: #ccc; }
.loupe canvas { display: block; width: 100%; height: 100%; }

.panel { flex: none; display: flex; flex-direction: column; gap: 10px; }

.ref-card { background: var(--card); border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
.ref-card .sw { width: 44px; height: 44px; flex: none; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  background: repeating-linear-gradient(45deg, #EDEDED 0 6px, #E2E2E2 6px 12px); }
.ref-card .tx { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ref-card .tx b { font-size: 14px; }
.ref-card .tx span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.ref-card.error .tx b { color: var(--bad-ink); }
.ref-card.warn .tx b { color: var(--warn-ink); }

.status-line { min-height: 22px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
.status-line .st { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; min-width: 0; }
.status-line .st.good { color: var(--good-ink); }
.status-line .st.warn { color: var(--warn-ink); }
.status-line .raw { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.chip-sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.link-btn { border: 0; background: none; padding: 0; font-weight: 700; text-decoration: underline; cursor: pointer; color: inherit; font-size: inherit; }

.colour-bar { display: flex; gap: 10px; height: 64px; }
.colour-bar .cb-sw { flex: 7; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); display: flex; align-items: flex-end; gap: 8px; padding: 10px; flex-wrap: wrap; align-content: flex-end;
  background: repeating-linear-gradient(45deg, #E9E9E9 0 8px, #DEDEDE 8px 16px); }
.colour-bar .cb-hex { flex: 3; min-width: 0; border-radius: 16px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.colour-bar .cb-hex b { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.colour-bar .cb-hex small { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.colour-bar .cb-hex .empty { font-family: var(--font); font-size: 12px; color: var(--muted); text-align: center; padding: 0 6px; }

/* ---------- desktop guide panel ---------- */
.guide-card { background: var(--card); border-radius: 22px; padding: clamp(20px, 3.2vh, 34px) 32px; display: flex; flex-direction: column; gap: clamp(10px, 1.8vh, 18px); box-shadow: 0 4px 18px rgba(0,0,0,.06); }
.guide-card .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.guide-card h2 { margin: 0; font-size: clamp(24px, 3.6vh, 34px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.tips3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tipcard { background: var(--card); border-radius: 18px; padding: clamp(14px, 2.2vh, 22px) 20px; display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 14px); }
.tipcard .num { width: 34px; height: 34px; border-radius: 17px; border: 1.5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
.tipcard span:last-child { font-size: 15px; font-weight: 600; line-height: 1.3; }
.msg { font-size: 13px; line-height: 1.4; padding: 10px 14px; border-radius: 12px; }
.msg.error { background: var(--bad-bg); color: var(--bad-ink); }
.msg.warn { background: var(--warn-bg); color: var(--warn-ink); }

/* ---------- results ---------- */
.score-card { background: var(--card); border-radius: 22px; padding: 16px; display: flex; gap: 16px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
.ring { position: relative; width: var(--ring, 112px); height: var(--ring, 112px); flex: none; }
.ring svg { display: block; width: 100%; height: 100%; }
.ring .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .num { font-size: calc(var(--ring, 112px) * 0.34); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.ring .of { font-size: 11px; color: var(--muted); margin-top: 2px; }
.score-text { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.score-text .pills { display: flex; flex-wrap: wrap; gap: 6px; }
.score-text h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
.score-text p { margin: 0; font-size: 13px; line-height: 1.4; color: #444; }

.colouring { background: var(--card); border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.colouring .row { display: flex; align-items: center; }
.colouring .sw { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.colouring .sw i { width: var(--dot, 40px); height: var(--dot, 40px); border-radius: 50%; display: block; }
.colouring .sw.me i { box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px var(--ink); }
.colouring .sw span { font-size: 11px; color: #444; }
.colouring .sw.me span { font-weight: 600; color: var(--ink); }
.colouring .line { flex: 1; height: 1px; margin: 0 8px 16px; background: var(--line); }
.colouring .sw + .sw:not(.me) { margin-left: 14px; }

.factor-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.factor { background: var(--card); border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.factor .top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.factor .top span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.factor .top b { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.factor .txt { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-score .factor .top { flex-direction: column; align-items: flex-start; gap: 0; }
.m-score .factor .top span { width: 100%; }

.tip { display: flex; flex-direction: column; gap: 10px; background: var(--tip-bg); border-radius: 16px; padding: 12px; }
.tip .tl { display: flex; gap: 8px; align-items: center; padding: 0 2px; font-size: 13px; line-height: 1.35; color: var(--tip-ink); }
.tip .tl svg { flex: none; }
.tip .tl span { flex: 1; }
.sugg { display: flex; gap: 8px; height: 52px; }
.sugg .s-sw { flex: 7; border-radius: 12px; display: flex; align-items: center; padding: 0 10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.sugg .s-hex { flex: 3; min-width: 0; border-radius: 12px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.sugg .s-hex b { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.sugg .s-hex small { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.tip .btn-primary { height: 36px; padding: 0 14px; font-size: 13px; border-radius: 18px; }

/* mobile score screen */
.m-score { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.band { height: clamp(104px, 18vh, 150px); flex: none; padding: max(16px, env(safe-area-inset-top)) 16px 16px; display: flex; justify-content: space-between; align-items: flex-start; }
.band .left { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.hex-chip { background: rgba(255,255,255,.94); border-radius: 12px; padding: 7px 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.hex-chip b { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.hex-chip small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.hex-chip .raw { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font); font-size: 10px; color: var(--muted); white-space: nowrap; }
.hex-chip .raw.st-good { color: var(--good-ink); font-weight: 600; }
.hex-chip .raw.st-warn { color: var(--warn-ink); font-weight: 600; }
.hex-chip .raw .mono { font-weight: 400; color: var(--muted); }
.m-score-body { flex: 1; min-height: 0; margin-top: -24px; padding: 0 16px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; position: relative; overflow-y: auto; }
.grow { flex: 1; min-height: 0; }

/* compact phones (e.g. iPhone SE, small Android) */
@media (max-height: 760px) {
  .band { height: 100px; }
  .m-score-body { gap: 9px; }
  .m-score .score-card { padding: 12px; --ring: 86px; }
  .m-score .score-text h2 { font-size: 18px; }
  .m-score .score-text { gap: 5px; }
  .m-score .colouring { padding: 9px 14px; gap: 6px; --dot: 32px; }
  .m-score .factor { padding: 9px 10px; gap: 6px; }
  .m-score .factor .top b { font-size: 17px; }
  .m-score .tip { padding: 10px; gap: 8px; }
  .m-score .sugg { height: 44px; }
  .m-score .btn-primary { height: 50px; }
  .big-primary { min-height: 200px; }
  .big-secondary { height: 96px; }
}
@media (max-height: 640px) {
  .m-score .score-text p { display: none; }
  .m-score .colouring { display: none; }
}

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; max-width: min(92vw, 520px); text-align: center;
  transition: opacity .2s, transform .2s; z-index: 40; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* =========================================================
   Desktop: split view
   ========================================================= */
@media (min-width: 900px) and (min-aspect-ratio: 5/4) {
  .topbar { display: flex; }
  .work { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0; gap: 0; }
  .m-head { display: none; }
  .stage-wrap { padding: clamp(14px, 3vh, 30px) 20px clamp(20px, 3.6vh, 36px) 40px; min-height: 0; }
  .stage-box { width: 100%; }
  .panel { min-height: 0; padding: clamp(14px, 3vh, 30px) 40px clamp(20px, 3.6vh, 36px) 20px; gap: clamp(10px, 2.2vh, 24px); overflow-y: auto; }
  .colour-bar { height: clamp(76px, 10.5vh, 104px); gap: 12px; }
  .colour-bar .cb-sw { border-radius: 18px; padding: 14px; }
  .colour-bar .cb-hex { border-radius: 18px; }
  .colour-bar .cb-hex b { font-size: 18px; }
  .colour-bar .cb-hex small { font-size: 12px; }
  .panel .btn-primary.block { height: 56px; border-radius: 28px; flex: none; }

  /* result panel */
  .panel.result { gap: clamp(10px, 1.6vh, 14px); }
  .colour-block { height: clamp(88px, 12vh, 116px); flex: none; border-radius: 20px; display: flex; align-items: flex-end; justify-content: space-between; padding: 14px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .colour-block .left { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .colour-block .hexrow { background: rgba(255,255,255,.94); border-radius: 12px; padding: 8px 14px; display: flex; gap: 14px; align-items: center; }
  .colour-block .hexrow b { font-family: var(--mono); font-size: 20px; font-weight: 600; }
  .colour-block .hexrow small { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .colour-block .hexrow .sep { width: 1px; height: 18px; background: var(--line); }
  .colour-block .hexrow .raw { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; flex: none; }
  .panel.result .score-card { padding: clamp(10px, 1.6vh, 16px) 20px; box-shadow: 0 4px 18px rgba(0,0,0,.06); --ring: clamp(84px, 12.5vh, 120px); }
  .panel.result .score-text h2 { font-size: 22px; }
  .panel.result .colouring { padding: 18px 20px; gap: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.06); justify-content: center; --dot: 44px; }
  .explain { background: var(--card); border-radius: 20px; padding: clamp(12px, 1.8vh, 18px) 22px; display: flex; flex-direction: column; gap: 12px; flex: none; }
  .explain p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink-2); }
  .panel.result .tip { padding: 10px 12px; gap: 8px; }
  .panel.result .sugg { height: clamp(40px, 5.4vh, 50px); }
  .panel.result .btn-primary { height: clamp(46px, 6vh, 54px); }
  .panel.result .factor-grid { flex: none; }
  .panel.result .factor { padding: clamp(10px, 1.5vh, 14px) 14px; gap: clamp(6px, 1vh, 10px); }
  .panel.result .factor .top b { font-size: 20px; }
  .actions-right { display: flex; justify-content: flex-end; flex: none; }
  .copy-btn { background: rgba(255,255,255,.94); }
}
@media (min-width: 900px) and (min-aspect-ratio: 5/4) and (max-height: 960px) {
  .topbar { height: 56px; }
  .panel.result .colour-block { height: clamp(74px, 10vh, 96px); }
  .explain p { font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .panel.result .factor { padding: 9px 14px; gap: 6px; }
  .panel.result .factor .top b { font-size: 18px; }
  .panel.result .colouring { padding: 12px 18px; }
  .tips3 .tipcard span:last-child { font-size: 14px; }
}

    lctx.strokeStyle = '#fff'; lctx.beginPath(); lctx.arc(c, c, rr, 0, Math.PI * 2); lctx.stroke();
    lctx.strokeStyle = '#161616'; lctx.lineWidth = 1 * dpr; lctx.beginPath(); lctx.arc(c, c, rr + 1.5 * dpr, 0, Math.PI * 2); lctx.stroke();
    lctx.beginPath(); lctx.moveTo(c - rr - 10 * dpr, c); lctx.lineTo(c - rr - 2 * dpr, c); lctx.moveTo(c + rr + 2 * dpr, c); lctx.lineTo(c + rr + 10 * dpr, c);
    lctx.moveTo(c, c - rr - 10 * dpr); lctx.lineTo(c, c - rr - 2 * dpr); lctx.moveTo(c, c + rr + 2 * dpr); lctx.lineTo(c, c + rr + 10 * dpr);
    lctx.strokeStyle = '#fff'; lctx.lineWidth = 2 * dpr; lctx.stroke();
    var left, top, vw = window.innerWidth, vh = window.innerHeight;
    if (kind === 'mouse' || kind === 'key') { left = clientX + 24; top = clientY - size - 24; }
    else { left = clientX - size / 2; top = clientY - size - 70; if (top < 8) top = clientY + 60; }
    left = Math.max(8, Math.min(vw - size - 8, left));
    top = Math.max(8, Math.min(vh - size - 8, top));
    loupe.style.left = left + 'px'; loupe.style.top = top + 'px';
    loupe.hidden = false;
  }
  function hideLoupe() { loupe.hidden = true; }

  /* ---------------------------------------------------------------- */
  /* Sampling                                                         */
  /* ---------------------------------------------------------------- */
  function sampleAt(pt, kind) {
    var r = patchRadius(kind);
    var smp = E.samplePatch(S.img.data, S.img.w, S.img.h, pt.x, pt.y, r, kind);
    if (kind === 'fabric' && smp && smp.mixed) {
      // a print or stripe: try a smaller spot before calling it mixed
      for (var k = 2; k <= 4; k++) {
        var small = E.samplePatch(S.img.data, S.img.w, S.img.h, pt.x, pt.y, Math.max(2, r / k), kind);
        if (small && !small.mixed && small.kept >= 6) { small.small = true; return small; }
      }
    }
    return smp;
  }

  // Live preview while the finger / mouse is down (no full re-render)
  var rafPending = false, pendingPt = null;
  function preview(pt) {
    pendingPt = pt;
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      var p = pendingPt; if (!p || !S.img) return;
      if (S.mode === 'calibrate') {
        var w = sampleAt(p, 'white'); if (!w) return;
        setLive(w.rawHex, E.hexToRgb8(w.rawHex));
      } else {
        var f = sampleAt(p, 'fabric'); if (!f) return;
        var lab = E.correctSample(f.lin, S.calib);
        setLive(hexOfLab(lab), E.labToRgb8(lab));
      }
    });
  }
  function setLive(hex, rgb) {
    var sw = main.querySelector('[data-live-sw]'), hx = main.querySelector('[data-live-hex]');
    if (sw) sw.style.background = hex;
    if (hx) hx.innerHTML = '<b>' + hex + '</b><small>' + rgbDots(rgb) + '</small>';
  }

  function commit(pt) {
    if (!S.img) return;
    if (S.mode === 'calibrate') {
      var w = sampleAt(pt, 'white'); if (!w) return;
      S.whitePt = pt;
      S.white = E.analyseWhite(w, S.refType, S.img.brightY);
      render();
      return;
    }
    var f = sampleAt(pt, 'fabric'); if (!f) return;
    S.fabricPt = pt;
    S.fabric = f;
    S.fabricLab = E.correctSample(f.lin, S.calib);
    if (S.mode === 'result') { evaluateNow(); }
    render();
  }

  function evaluateNow() {
    S.result = E.evaluate(S.fabricLab, person, { level: S.level, mixed: S.fabric && S.fabric.mixed });
  }

  // Pointer handling on the photo
  var activeId = null;
  photo.addEventListener('pointerdown', function (e) {
    if (!S.img || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    try { photo.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    activeId = e.pointerId;
    var pt = toImage(e.clientX, e.clientY);
    drawLoupe(pt, e.clientX, e.clientY, e.pointerType);
    preview(pt);
  });
  photo.addEventListener('pointermove', function (e) {
    if (!S.img) return;
    var pressed = activeId === e.pointerId;
    if (!pressed && e.pointerType !== 'mouse') return;
    var pt = toImage(e.clientX, e.clientY);
    drawLoupe(pt, e.clientX, e.clientY, e.pointerType);
    if (pressed) preview(pt);
  });
  photo.addEventListener('pointerup', function (e) {
    if (activeId !== e.pointerId) return;
    activeId = null;
    var pt = toImage(e.clientX, e.clientY);
    if (e.pointerType !== 'mouse') hideLoupe();
    commit(pt);
  });
  photo.addEventListener('pointercancel', function () { activeId = null; hideLoupe(); });
  photo.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && activeId === null) hideLoupe(); });
  photo.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Keyboard eyedropper: arrows move, Enter / Space samples
  photo.addEventListener('keydown', function (e) {
    if (!S.img) return;
    var step = Math.max(1, Math.round(Math.min(S.img.w, S.img.h) * (e.shiftKey ? 0.05 : 0.01)));
    if (!S.kbd) S.kbd = { x: S.img.w / 2, y: S.img.h / 2 };
    var k = e.key, moved = true;
    if (k === 'ArrowLeft') S.kbd.x -= step; else if (k === 'ArrowRight') S.kbd.x += step;
    else if (k === 'ArrowUp') S.kbd.y -= step; else if (k === 'ArrowDown') S.kbd.y += step;
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); hideLoupe(); commit({ x: S.kbd.x, y: S.kbd.y }); return; }
    else if (k === 'Escape') { hideLoupe(); return; } else moved = false;
    if (!moved) return;
    e.preventDefault();
    S.kbd.x = Math.max(0, Math.min(S.img.w - 1, S.kbd.x)); S.kbd.y = Math.max(0, Math.min(S.img.h - 1, S.kbd.y));
    var r = photo.getBoundingClientRect();
    var cx = r.left + S.kbd.x / S.img.w * r.width, cy = r.top + S.kbd.y / S.img.h * r.height;
    drawLoupe(S.kbd, cx, cy, 'key');
    preview(S.kbd);
  });
  photo.addEventListener('blur', hideLoupe);

  /* ---------------------------------------------------------------- */
  /* Loading a photo                                                  */
  /* ---------------------------------------------------------------- */
  function loadFile(file) {
    if (!file) return;
    if (file.type && !/^image\//.test(file.type)) { toast('Please choose a photo (JPG, PNG, WebP or HEIC).'); return; }
    decode(file).then(function (src) {
      var nw = src.width, nh = src.height;
      if (!nw || !nh) throw new Error('empty');
      var k = Math.min(1, MAX_SIDE / Math.max(nw, nh));
      var w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
      photo.width = w; photo.height = h;
      pctx.imageSmoothingEnabled = true; pctx.imageSmoothingQuality = 'high';
      pctx.drawImage(src.image, 0, 0, w, h);
      if (src.close) src.close();
      var data = pctx.getImageData(0, 0, w, h).data;
      S.img = { w: w, h: h, data: data, brightY: E.brightReference(data, w, h) };
      S.whitePt = S.white = S.calib = S.fabricPt = S.fabric = S.fabricLab = S.result = S.kbd = null;
      S.level = 'uncalibrated';
      S.screen = 'work'; S.mode = 'calibrate';
      photo.setAttribute('aria-label', 'Your photo. Tap, or use the arrow keys and Enter, to sample a colour.');
      pushNav();
      render();
    }).catch(function () {
      toast("This browser can't open that file. Try a JPG or PNG" + (/heic|heif/i.test((file.type || '') + (file.name || '')) ? ' (HEIC photos open in Safari).' : '.'));
    });
  }

  // Decode straight from the file (no URL, so the pixels are always readable), with a fallback
  function decode(file) {
    function viaBitmap(opts) {
      return createImageBitmap(file, opts).then(function (bmp) {
        return { image: bmp, width: bmp.width, height: bmp.height, close: function () { bmp.close && bmp.close(); } };
      });
    }
    function viaImage() {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function () { resolve({ image: img, width: img.naturalWidth, height: img.naturalHeight, close: function () { URL.revokeObjectURL(url); } }); };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
        img.src = url;
      });
    }
    if (typeof createImageBitmap !== 'function') return viaImage();
    return viaBitmap({ imageOrientation: 'from-image' })
      .catch(function () { return viaBitmap(undefined); })
      .catch(viaImage);
  }
  pickCamera.addEventListener('change', function () { loadFile(pickCamera.files[0]); pickCamera.value = ''; });
  pickFile.addEventListener('change', function () { loadFile(pickFile.files[0]); pickFile.value = ''; });

  // Drag & drop and paste (desktop)
  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; var dz = main.querySelector('.dropzone'); if (dz) dz.classList.add('over'); });
  window.addEventListener('dragleave', function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) { var dz = main.querySelector('.dropzone'); if (dz) dz.classList.remove('over'); } });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0;
    var dz = main.querySelector('.dropzone'); if (dz) dz.classList.remove('over');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
  window.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.files;
    if (items && items[0] && /^image\//.test(items[0].type)) loadFile(items[0]);
  });

  /* ---------------------------------------------------------------- */
  /* Navigation (Android back button support when top-level)          */
  /* ---------------------------------------------------------------- */
  var canHistory = false;
  try { canHistory = window.top === window && !!window.history.pushState; } catch (err) { canHistory = false; }
  function pushNav() { if (canHistory) { try { history.pushState({ cc: 1 }, ''); } catch (err) { /* ignore */ } } }
  function goBack() {
    if (canHistory && history.state && history.state.cc) { try { history.back(); return; } catch (err) { /* fall through */ } }
    stepBack();
  }
  function stepBack() {
    hideLoupe();
    if (S.screen === 'score') { S.screen = 'work'; S.mode = 'pick'; }
    else if (S.screen === 'work') {
      if (S.mode === 'result') S.mode = 'pick';
      else if (S.mode === 'pick') S.mode = 'calibrate';
      else { S.screen = 'start'; }
    }
    render();
  }
  window.addEventListener('popstate', function () { if (S.screen !== 'start') stepBack(); });

  /* ---------------------------------------------------------------- */
  /* Actions                                                          */
  /* ---------------------------------------------------------------- */
  var ACTIONS = {
    camera: function () { pickCamera.click(); },
    gallery: function () { pickFile.click(); },
    file: function () { pickFile.click(); },
    back: function () { goBack(); },
    restart: function () {
      hideLoupe();
      S.screen = 'start'; S.img = null; S.result = null;
      if (canHistory) { try { history.replaceState(null, ''); } catch (err) { /* ignore */ } }
      render();
    },
    ref: function (el) {
      S.refType = el.getAttribute('data-ref') === 'grey' ? 'grey' : 'white';
      if (S.whitePt) S.white = E.analyseWhite(sampleAt(S.whitePt, 'white'), S.refType, S.img.brightY);
      render();
    },
    useWhite: function () {
      if (!S.white || !S.white.ok) return;
      S.calib = E.makeCalibration(S.white);
      S.level = S.white.level === 'good' ? 'calibrated' : 'partial';
      if (S.fabric) S.fabricLab = E.correctSample(S.fabric.lin, S.calib);
      S.mode = 'pick'; pushNav(); render();
    },
    skip: function () {
      S.calib = null; S.level = 'uncalibrated';
      if (S.fabric) S.fabricLab = E.correctSample(S.fabric.lin, null);
      S.mode = 'pick'; pushNav(); render();
    },
    recalibrate: function () { S.mode = 'calibrate'; S.screen = 'work'; render(); },
    continue: function (el) {
      if (!S.fabricLab) return;
      el.disabled = true;
      setTimeout(function () {
        evaluateNow();
        if (isDesktop()) { S.mode = 'result'; } else { S.screen = 'score'; }
        pushNav(); render();
      }, 16);
    },
    copy: function () {
      if (!S.result) return;
      var hex = S.result.hex;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(hex).then(function () { toast('Copied ' + hex); }, function () { toast(hex); });
      } else toast(hex);
    }
  };
  main.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el);
  });

  /* ---------------------------------------------------------------- */
  /* Templates                                                        */
  /* ---------------------------------------------------------------- */
  function startMobile() {
    return '<section class="m-start">' +
      '<div class="brand">Colour Check</div>' +
      '<div class="m-start-actions">' +
      '<button class="big-primary" data-act="camera">' + I.camera() + '<span class="t">Take photo</span><span class="s">Daylight or bright light. Include a white price tag or receipt next to the fabric.</span></button>' +
      '<button class="big-secondary" data-act="gallery">' + I.gallery() + 'Choose from gallery</button>' +
      '</div>' +
      '<p class="m-foot">' + I.lock() + 'Photos never leave your phone</p>' +
      '</section>';
  }
  function startDesktop() {
    return '<section class="d-start"><div class="dropzone">' + I.upload() +
      '<h1>Drop a fabric photo here</h1><p class="or">or</p>' +
      '<button class="btn-primary" data-act="file">' + I.clip() + 'Choose file</button>' +
      '<p class="hint">JPG, PNG or WebP. Include something white (a price tag or receipt) next to the fabric for accurate colour. The photo never leaves your browser.</p>' +
      '</div></section>';
  }

  function refCard() {
    var w = S.white, cls = '', title, sub, sw = '';
    if (!w) {
      title = S.refType === 'grey' ? 'Tap the grey card' : 'No white picked yet';
      sub = S.refType === 'grey' ? 'Hold it in the same light as the fabric.' : 'A price tag, receipt or white card in the same photo works best.';
    } else {
      sw = ' style="background:' + w.hex + '"';
      if (!w.ok) { cls = ' error'; title = "Can't use this spot"; sub = w.message; }
      else if (w.level === 'warn') { cls = ' warn'; title = w.cast.label; sub = w.message; }
      else { title = w.cast.label; sub = 'Looks good. Tap “Use this white”.'; }
    }
    return '<div class="ref-card' + cls + '"><div class="sw" data-live-sw' + sw + '></div><div class="tx"><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></div></div>';
  }

  function refToggle() {
    return '<div class="seg" role="group" aria-label="Reference type">' +
      '<button data-act="ref" data-ref="white" aria-pressed="' + (S.refType === 'white') + '">White</button>' +
      '<button data-act="ref" data-ref="grey" aria-pressed="' + (S.refType === 'grey') + '">Grey card</button></div>';
  }

  function calStatus() {
    if (S.level === 'calibrated') return { tone: 'good', text: 'Calibrated · ' + castShort(S.calib.cast), pill: 'Calibrated' };
    if (S.level === 'partial') return { tone: 'warn', text: 'Partly calibrated · white was overexposed', pill: 'Partly calibrated' };
    return { tone: 'warn', text: 'Not calibrated · lighting may shift colours', pill: 'Not calibrated' };
  }

  function colourBar(hex, rgb, inner, emptyText) {
    var swStyle = hex ? ' style="background:' + hex + '"' : '';
    var hx = hex ? '<b>' + hex + '</b><small>' + rgbDots(rgb) + '</small>' : '<span class="empty">' + esc(emptyText || 'Tap the photo') + '</span>';
    return '<div class="colour-bar"><div class="cb-sw" data-live-sw' + swStyle + '>' + (inner || '') + '</div><div class="cb-hex" data-live-hex>' + hx + '</div></div>';
  }

  function workMobile() {
    var head, panel;
    if (S.mode === 'calibrate') {
      head = '<button class="icon-btn" data-act="back" aria-label="Back">' + I.back() + '</button>' +
        '<div class="m-title"><span class="k">Step 1 of 2 · Calibrate</span><span class="t">' + (S.refType === 'grey' ? 'Tap the grey card' : 'Tap something white') + '</span></div>' +
        '<span class="head-spacer" aria-hidden="true"></span>';
      panel = '<div class="status-line"><span class="st">Reference</span>' + refToggle() + '</div>' + refCard() +
        '<button class="btn-primary block" data-act="useWhite"' + (S.white && S.white.ok ? '' : ' disabled') + '>' + I.check() + 'Use this white</button>' +
        '<button class="btn-text" data-act="skip">Skip for now (less accurate)</button>';
    } else {
      var st = calStatus();
      head = '<button class="icon-btn" data-act="back" aria-label="Back">' + I.back() + '</button>' +
        '<div class="m-title center"><span class="t">Tap the fabric to sample</span></div>' +
        '<button class="icon-btn" data-act="recalibrate" aria-label="Calibrate white point">' + I.target() + '</button>';
      var hex = S.fabricLab ? hexOfLab(S.fabricLab) : null, rgb = S.fabricLab ? E.labToRgb8(S.fabricLab) : null;
      var right = (S.fabric && S.level !== 'uncalibrated') ? '<span class="raw"><i class="chip-sw" style="background:' + S.fabric.rawHex + '"></i>Camera <span class="mono">' + S.fabric.rawHex + '</span></span>' : '';
      var left = S.level === 'uncalibrated'
        ? '<span class="st warn">' + I.alert() + 'Not calibrated · <button class="link-btn" data-act="recalibrate">Calibrate</button></span>'
        : '<span class="st ' + st.tone + '">' + (st.tone === 'good' ? I.check(13) : I.alert()) + esc(st.text) + '</span>';
      var inner = S.fabric && S.fabric.mixed ? '<span class="pill glass warn">Mixed colours here</span>' : '';
      panel = '<div class="status-line">' + left + right + '</div>' + colourBar(hex, rgb, inner, 'Tap the fabric') +
        '<button class="btn-primary block" data-act="continue"' + (S.fabricLab ? '' : ' disabled') + '>Continue' + I.next() + '</button>';
    }
    return '<section class="work"><div class="m-head">' + head + '</div>' +
      '<div class="stage-wrap"><div class="stage-box"></div></div>' +
      '<div class="panel">' + panel + '</div></section>';
  }

  function guide(step, heading, tips, extra) {
    return '<div class="guide-card"><div class="row"><span class="pill ink">' + step + '</span>' + (extra || '') + '</div><h2>' + heading + '</h2></div>' +
      '<div class="tips3">' + tips.map(function (t, i) { return '<div class="tipcard"><span class="num">' + (i + 1) + '</span><span>' + t + '</span></div>'; }).join('') + '</div>';
  }

  function workDesktop() {
    var panel, cls = 'panel';
    if (S.mode === 'calibrate') {
      var w = S.white, inner = '', msg = '';
      if (w) {
        inner = w.ok ? '<span class="pill glass' + (w.level === 'warn' ? ' warn' : '') + '">' + esc(w.cast.label) + '</span>' : '<span class="pill bad">Not usable</span>';
        if (!w.ok) msg = '<div class="msg error">' + esc(w.message) + '</div>';
        else if (w.level === 'warn') msg = '<div class="msg warn">' + esc(w.message) + '</div>';
      }
      panel = guide('Step 1 of 2', S.refType === 'grey' ? 'Click the grey card in the photo' : 'Click something white in the photo',
        S.refType === 'grey' ? ['Hold the card in the same light', 'Click its flat middle', 'Set again for each photo'] : ['Find a price tag or receipt', 'Click its flat, plain part', 'Set again for each photo'], refToggle()) +
        colourBar(w ? w.hex : null, w ? E.hexToRgb8(w.hex) : null, inner, 'Click the photo') + msg +
        '<div class="grow"></div>' +
        '<button class="btn-primary block" data-act="useWhite"' + (w && w.ok ? '' : ' disabled') + '>' + I.check() + 'Use this white</button>' +
        '<button class="btn-text" data-act="skip">Skip for now (less accurate)</button>';
    } else if (S.mode === 'pick') {
      var st = calStatus();
      var hex = S.fabricLab ? hexOfLab(S.fabricLab) : null, rgb = S.fabricLab ? E.labToRgb8(S.fabricLab) : null;
      var pills = '<span class="pill ' + st.tone + '">' + (st.tone === 'good' ? I.check(12) : I.alert(12)) + esc(st.pill) + '</span>' +
        '<button class="pill glass" data-act="recalibrate" style="border:0;cursor:pointer">' + (S.level === 'uncalibrated' ? 'Calibrate' : 'Reset') + '</button>' +
        (S.fabric && S.fabric.mixed ? '<span class="pill glass warn">Mixed colours here</span>' : '');
      var note = S.level === 'uncalibrated' ? '<div class="msg warn">Without a white reference, store lighting can shift the colour. The score will be shown as an estimate.</div>' : '';
      panel = guide('Step 2 of 2', 'Click the shirt to pick its colour', ['Pick a flat, even area', 'Stay off folds and shine', 'Check the preview matches']) +
        colourBar(hex, rgb, pills, 'Click the fabric') + note +
        '<div class="grow"></div>' +
        '<button class="btn-primary block" data-act="continue"' + (S.fabricLab ? '' : ' disabled') + '>Continue' + I.next() + '</button>' +
        '<button class="btn-text" data-act="restart">Check another photo</button>';
    } else {
      cls = 'panel result';
      panel = resultDesktop();
    }
    return '<section class="work"><div class="stage-wrap"><div class="stage-box"></div></div><div class="' + cls + '">' + panel + '</div></section>';
  }

  /* ---------- result pieces ---------- */
  function ring(r) {
    var C = 326.73, est = r.level === 'uncalibrated';
    var t = est ? 'warn' : tone(r.score), col = toneColour(t);
    var track = t === 'good' ? '#E6EFE9' : t === 'warn' ? '#F7E6CC' : '#F6DAD7';
    var arcs = '<circle cx="60" cy="60" r="52" fill="none" stroke="' + (est ? '#EDEDED' : track) + '" stroke-width="12"></circle>';
    if (est) arcs += '<circle cx="60" cy="60" r="52" fill="none" stroke="#F3D9B0" stroke-width="12" stroke-dasharray="' + (r.range.hi / 100 * C).toFixed(1) + ' ' + C + '" transform="rotate(-90 60 60)"></circle>';
    arcs += '<circle cx="60" cy="60" r="52" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (Math.max(1, (est ? r.range.lo : r.score)) / 100 * C).toFixed(1) + ' ' + C + '" transform="rotate(-90 60 60)"></circle>';
    var label = est ? 'Estimated score ' + r.score + ', plus or minus ' + r.range.half : 'Score ' + r.score + ' out of 100';
    return '<div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="' + label + '">' + arcs + '</svg>' +
      '<div class="val"><span class="num">' + (est ? '~' : '') + r.score + '</span><span class="of">' + (est ? '± ' + r.range.half + ' / 100' : '/ 100') + '</span></div></div>';
  }

  function headline(r) {
    if (r.level !== 'uncalibrated') return r.verdict.title;
    var lo = E.verdictFor(r.range.lo), hi = E.verdictFor(r.range.hi);
    if (lo.band === hi.band) return 'Likely ' + (/^[aeiou]/i.test(lo.title) ? 'an ' : 'a ') + lo.title.toLowerCase();
    return lo.title.replace(' match', '') + ' to ' + hi.title.replace(' match', '').toLowerCase() + ' match';
  }

  function chip(r) {
    if (r.mixed) return '<span class="pill warn">' + I.alert(11) + 'Mixed reading</span>';
    if (r.level === 'uncalibrated') return '<span class="pill warn">Estimate</span>';
    var t = r.verdict.tone;
    return '<span class="pill ' + t + '">' + (t === 'good' ? I.check(13) : I.alert()) + esc(r.verdict.chip) + '</span>';
  }

  function scoreCard(r, withSummary, withStatus) {
    var pills = chip(r);
    if (withStatus) {
      var st = calStatus();
      if (S.level !== 'uncalibrated') pills += '<span class="pill ' + st.tone + '">' + (st.tone === 'good' ? I.check(11) : I.alert(11)) + esc(st.pill) + '</span>';
      else pills += '<span class="pill warn">' + I.alert(11) + 'Not calibrated</span>';
    }
    return '<section class="score-card">' + ring(r) + '<div class="score-text"><div class="pills">' + pills + '</div><h2>' + esc(headline(r)) + '</h2>' +
      (withSummary ? '<p>' + esc(r.summary) + '</p>' : '') + '</div></section>';
  }

  function colouring(r) {
    function sw(hex, label, me) { return '<div class="sw' + (me ? ' me' : '') + '"><i style="background:' + hex + '"></i><span>' + label + '</span></div>'; }
    return '<section class="colouring"><div class="label">Next to your colouring</div><div class="row">' +
      sw(r.hex, 'Fabric', true) + '<div class="line"></div>' + sw(person.skinHex, 'Skin') + sw(person.hairHex, 'Hair') + sw(person.eyesHex, 'Eyes') +
      '</div></section>';
  }

  function factors(r, long) {
    var est = r.level === 'uncalibrated';
    return '<section class="factor-grid">' + r.factors.map(function (f) {
      var neutral = f.key === 'harmony' && f.text === 'Neutral';
      var col = est || neutral ? 'var(--grey)' : toneColour(f.score >= 75 ? 'good' : f.score >= 45 ? 'warn' : 'bad');
      return '<div class="factor"><div class="top"><span>' + esc(long ? f.label : f.short) + '</span><b>' + f.score + '</b></div>' +
        '<div class="bar"><i style="width:' + Math.max(2, f.score) + '%;background:' + col + '"></i></div><span class="txt">' + esc(f.text) + '</span></div>';
    }).join('') + '</section>';
  }

  function tipBlock(r) {
    if (r.mixed) {
      return '<div class="tip"><div class="tl">' + I.alert(18) + '<span>This spot mixes several colours (a print or stripe), so the score is for their average. Tap a single colour for a reliable result.</span></div></div>';
    }
    if (r.level === 'uncalibrated') {
      return '<div class="tip"><div class="tl">' + I.bulb() + '<span>Tap a white tag to firm up this score.</span>' +
        '<button class="btn-primary" data-act="recalibrate">Calibrate</button></div></div>';
    }
    var s = r.suggestion;
    var sug = s ? '<div class="sugg"><div class="s-sw" style="background:' + s.hex + '"><span class="pill glass">Scores ~' + s.score + '</span></div>' +
      '<div class="s-hex"><b>' + s.hex + '</b><small>' + rgbDots(s.rgb) + '</small></div></div>' : '';
    return '<div class="tip"><div class="tl">' + I.bulb() + '<span>' + esc(r.tip) + '</span></div>' + sug + '</div>';
  }

  function scoreMobile() {
    var r = S.result, st = calStatus();
    var raw = S.level === 'uncalibrated'
      ? '<span class="raw st-warn">' + I.alert(10) + 'Not calibrated · raw camera colour</span>'
      : '<span class="raw st-' + st.tone + '">' + (st.tone === 'good' ? I.check(10) : I.alert(10)) + esc(st.pill) + ' · <i class="chip-sw" style="width:10px;height:10px;background:' + S.fabric.rawHex + '"></i><span class="mono">' + S.fabric.rawHex + '</span></span>';
    return '<section class="m-score">' +
      '<div class="band" style="background:' + r.hex + '"><div class="left">' +
      '<button class="icon-btn glass" data-act="back" aria-label="Back to photo">' + I.back() + '</button></div>' +
      '<div class="hex-chip"><b>' + r.hex + '</b><small>RGB ' + r.rgb.join(', ') + '</small>' + raw + '</div></div>' +
      '<div class="m-score-body">' + scoreCard(r, true, false) + colouring(r) + factors(r, false) + tipBlock(r) +
      '<div class="grow"></div><button class="btn-primary block" data-act="restart">' + I.again() + 'Check another</button></div></section>';
  }

  function resultDesktop() {
    var r = S.result, st = calStatus();
    var raw = S.level === 'uncalibrated' ? '' : '<span class="sep"></span><span class="raw"><i class="chip-sw" style="width:14px;height:14px;background:' + S.fabric.rawHex + '"></i>Camera <span class="mono">' + S.fabric.rawHex + '</span></span>';
    var pill = '<span class="pill ' + st.tone + '">' + (st.tone === 'good' ? I.check(12) : I.alert(12)) + (S.level === 'calibrated' ? 'Calibrated colour' : esc(st.pill)) + '</span>';
    return '<div class="colour-block" style="background:' + r.hex + '"><div class="left">' + pill +
      '<div class="hexrow"><b>' + r.hex + '</b><small>RGB ' + r.rgb.join(', ') + '</small>' + raw + '</div></div>' +
      '<button class="icon-btn copy-btn" data-act="copy" aria-label="Copy hex code">' + I.copy() + '</button></div>' +
      '<div class="row2">' + scoreCard(r, false) + colouring(r) + '</div>' +
      '<div class="explain"><p>' + esc(r.explanation) + '</p>' + tipBlock(r) + '</div>' +
      factors(r, true) +
      '<div class="grow"></div>' +
      '<div class="actions-right"><button class="btn-primary" data-act="restart">' + I.again() + 'Check another</button></div>';
  }

  /* ---------------------------------------------------------------- */
  /* Render                                                           */
  /* ---------------------------------------------------------------- */
  function render() {
    var desk = isDesktop();
    // keep the flow consistent when the layout changes (rotate / resize)
    if (desk && S.screen === 'score') { S.screen = 'work'; S.mode = 'result'; }
    if (!desk && S.screen === 'work' && S.mode === 'result') { S.screen = 'score'; }
    if (!S.img && S.screen !== 'start') S.screen = 'start';

    app.setAttribute('data-layout', desk ? 'desktop' : 'mobile');
    app.setAttribute('data-screen', S.screen);
    app.setAttribute('data-mode', S.mode);

    var html;
    if (S.screen === 'start') html = desk ? startDesktop() : startMobile();
    else if (S.screen === 'score') html = scoreMobile();
    else html = desk ? workDesktop() : workMobile();
    main.innerHTML = html;

    var box = main.querySelector('.stage-box');
    if (box) { box.appendChild(stage); fitStage(); }
    hideLoupe();
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var desk = isDesktop();
      if (desk !== (app.getAttribute('data-layout') === 'desktop')) render(); else fitStage();
    }, 60);
  });
  if (DESKTOP.addEventListener) DESKTOP.addEventListener('change', render);

  /* ---------------------------------------------------------------- */
  /* Offline support (only when served over https as a normal page)   */
  /* ---------------------------------------------------------------- */
  if (!window.__SINGLE_FILE__ && 'serviceWorker' in navigator && canHistory &&
      (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache is optional */ });
    });
  }

  // Small hook for automated tests
  window.__colourCheck = { state: S, render: render, loadFile: loadFile, commit: commit, actions: ACTIONS };

  render();
})();

</script>
</body>
</html>
